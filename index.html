<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📘 Smart Study Planner</h1>
    <p class="subtitle">Plan your study. Study smart.</p>

    <div class="form">
      <input type="text" placeholder="Class (e.g. 9)" />
      <input type="text" placeholder="Subject (e.g. Math)" />
      <input type="time" />
      <button>Add Study</button>
    </div>

    <div class="study-list">
      <h2>Today's Study</h2>
      <ul>
        <li>Class 9 - Math at 6:00 PM</li>
        <li>Class 9 - Science at 7:30 PM</li>
      </ul>
    </div>
  </div>

</body>
</html>
